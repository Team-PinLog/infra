# PostgreSQL pgvector 전환 전 rollback용 정적 StatefulSet
# 대상 manifest와 모든 런타임/PVC 계약이 동일하며 postgres 이미지만 이전 exact digest다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pinlog-prod
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: pinlog
spec:
  serviceName: postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      nodeSelector:
        kubernetes.io/hostname: pinlog-master
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pinlog
            - name: POSTGRES_USER
              value: pinlog
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "pinlog"]
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pinlog"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 20Gi
