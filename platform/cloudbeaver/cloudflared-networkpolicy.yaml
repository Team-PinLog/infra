apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbeaver-cloudflared-restricted
  namespace: pinlog-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudbeaver-cloudflared
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudbeaver
      ports:
        - protocol: TCP
          port: 8978
    # This CNI has no FQDN policy. Cloudflare publishes changing anycast IPs, so
    # destination IPs cannot be safely pinned; constrain the practical fallback
    # to cloudflared's required outbound ports only.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 7844
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 443
