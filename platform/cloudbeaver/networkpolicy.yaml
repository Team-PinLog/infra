apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbeaver-restricted
  namespace: pinlog-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudbeaver
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudbeaver-cloudflared
      ports:
        - protocol: TCP
          port: 8978
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
