# kube-prometheus-stack — Prometheus + Grafana + Alertmanager + exporters
#
# 운영 알림은 Alertmanager → PinLog Sentinel Receiver → Mattermost로 전달한다.
# Receiver는 severity별 반복 정책과 무관하게 최종 포맷·멘션 정책을 강제한다.

# 저용량 상시 프로필은 metrics-server Deployment를 의도적으로 0으로 유지한다.
# 등록된 metrics.k8s.io APIService의 endpoint 부재를 장애로 오인하지 않도록
# 해당 기본 alert만 끄고 다른 aggregated API 경보는 유지한다.
defaultRules:
  disabled:
    KubeAggregatedAPIDown: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    secrets:
      - pinlog-sentinel-receiver-auth
      - pinlog-sentinel-receiver-ca
      - mattermost-alert-webhook
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
    resources:
      requests:
        memory: 64Mi
        cpu: 10m
      limits:
        memory: 192Mi
        cpu: 100m
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "namespace", "component"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h
      routes:
        # Sentinel 자체 장애는 Sentinel을 경유하면 순환 의존이므로 Mattermost로 직접 보낸다.
        - receiver: sentinel-fallback
          matchers:
            - component="sentinel-self-monitoring"
          repeat_interval: 1h
        - receiver: "null"
          matchers:
            - alertname="Watchdog"
        - receiver: pinlog-sentinel
          matchers:
            - severity="critical"
          repeat_interval: 1h
        - receiver: pinlog-sentinel
          matchers:
            - severity="warning"
          repeat_interval: 6h
    receivers:
      - name: "null"
      - name: pinlog-sentinel
        webhook_configs:
          - url: https://pinlog-sentinel-receiver.monitoring.svc.cluster.local:9765/alerts
            send_resolved: true
            timeout: 4m
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/pinlog-sentinel-receiver-auth/PINLOG_SENTINEL_TOKEN
              tls_config:
                ca_file: /etc/alertmanager/secrets/pinlog-sentinel-receiver-ca/ca.crt
                server_name: pinlog-sentinel-receiver.monitoring.svc.cluster.local
                min_version: TLS12
      - name: sentinel-fallback
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/mattermost-alert-webhook/url
            send_resolved: true
            title: '{{ if eq .Status "resolved" }}✅ 알림 전달 기능이 다시 정상이에요{{ else if eq .CommonLabels.alertname "PinLogSentinelDown" }}🚨 알림 전달 로봇이 멈췄어요{{ else if eq .CommonLabels.alertname "PinLogSentinelDeliveryFailed" }}⚠️ 알림을 보냈지만 도착하지 않았어요{{ else if eq .CommonLabels.alertname "PinLogSentinelDeadLetterAdded" }}⚠️ 못 보낸 알림이 보관함에 들어갔어요{{ else if eq .CommonLabels.alertname "PinLogSentinelInputRejectedOrBusy" }}⚠️ 알림 전달 로봇이 너무 바빠요{{ else if eq .CommonLabels.alertname "PinLogSentinelURLLinkCanary" }}✅ 비상 알림 길 테스트에 성공했어요{{ else }}⚠️ 알림 전달 기능에 문제가 생겼어요{{ end }}'
            title_link: https://monitoring.pin-log.com/alerting/list
            text: "{{ if and (eq .Status \"firing\") (eq .CommonLabels.severity \"critical\") }}@channel\n{{ end }}{{ if eq .Status \"resolved\" }}무슨 일: 앞에서 발견한 문제가 끝났어요.\n어떤 영향: 알림을 다시 정상적으로 받을 수 있어요.\n담당자: Infra · 김세민\n지금 할 일: 추가로 할 일은 없어요.{{ else if eq .CommonLabels.alertname \"PinLogSentinelDown\" }}무슨 일: Sentinel이 3분 동안 대답하지 않았어요.\n어떤 영향: 서비스에 문제가 생겨도 Mattermost 알림이 안 올 수 있어요.\n서비스 상태: 서비스 자체가 고장났다는 뜻은 아니에요.\n담당자: Infra · 김세민\n지금 할 일: Sentinel 상태를 확인해 주세요.{{ else if eq .CommonLabels.alertname \"PinLogSentinelDeliveryFailed\" }}무슨 일: Sentinel이 알림을 보냈지만 Mattermost에 도착하지 않았어요.\n어떤 영향: 운영 알림 일부를 놓칠 수 있어요.\n담당자: Infra · 김세민\n지금 할 일: Mattermost 연결을 확인해 주세요.{{ else if eq .CommonLabels.alertname \"PinLogSentinelDeadLetterAdded\" }}무슨 일: 보내지 못한 알림이 실패 알림 보관함에 들어갔어요.\n어떤 영향: 운영 알림 일부를 놓칠 수 있어요.\n담당자: Infra · 김세민\n지금 할 일: 실패 알림 보관함을 확인해 주세요.{{ else if eq .CommonLabels.alertname \"PinLogSentinelInputRejectedOrBusy\" }}무슨 일: Sentinel이 너무 바빠서 새 알림을 바로 받지 못했어요.\n어떤 영향: 새 알림이 늦게 오거나 안 올 수 있어요.\n담당자: Infra · 김세민\n지금 할 일: Sentinel 사용량을 확인해 주세요.{{ else if eq .CommonLabels.alertname \"PinLogSentinelURLLinkCanary\" }}무슨 일: 테스트 알림이 Mattermost까지 잘 도착했어요.\n어떤 영향: 실제 서비스 장애는 없어요.\n담당자: Infra · 김세민\n지금 할 일: 제목을 눌러 Grafana 화면이 열리는지만 확인해 주세요.{{ else }}무슨 일: 알림 전달 기능에서 알 수 없는 문제가 생겼어요.\n어떤 영향: 운영 알림 일부를 놓칠 수 있어요.\n담당자: Infra · 김세민\n지금 할 일: Sentinel 상태를 확인해 주세요.{{ end }}"

extraManifests:
  - apiVersion: v1
    kind: Service
    metadata:
      name: pinlog-sentinel-receiver
      namespace: monitoring
      labels:
        app.kubernetes.io/name: pinlog-sentinel-receiver
    spec:
      type: ExternalName
      externalName: 172-26-14-189.sslip.io
      ports:
        - name: https
          port: 9765
          protocol: TCP
          targetPort: 9765
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: ScrapeConfig
    metadata:
      name: pinlog-sentinel-receiver
      namespace: monitoring
      labels:
        release: kube-prometheus-stack
    spec:
      staticConfigs:
        - targets:
            - pinlog-sentinel-receiver.monitoring.svc.cluster.local:9765
      scheme: https
      metricsPath: /metrics
      scrapeInterval: 60s
      scrapeTimeout: 15s
      tlsConfig:
        ca:
          secret:
            name: pinlog-sentinel-receiver-ca
            key: ca.crt
        serverName: pinlog-sentinel-receiver.monitoring.svc.cluster.local
        minVersion: TLS12

# 기본 KubeQuotaAlmostFull은 severity=info라 Sentinel route에 전달되지 않는다.
# prod 용량 고갈·OOM·스케줄 실패는 운영자가 조치해야 하므로 warning으로 승격한다.
additionalPrometheusRulesMap:
  pinlog-sentinel-self-monitoring:
    groups:
      - name: pinlog-sentinel-self-monitoring
        rules:
          - alert: PinLogSentinelDown
            expr: |
              (up{job="scrapeConfig/monitoring/pinlog-sentinel-receiver"} == 0)
              or absent(up{job="scrapeConfig/monitoring/pinlog-sentinel-receiver"})
            for: 3m
            labels:
              severity: critical
              component: sentinel-self-monitoring
            annotations:
              summary: "Sentinel receiver target is unavailable"
          - alert: PinLogSentinelDeliveryFailed
            expr: |
              increase(pinlog_sentinel_receiver_events_total{result="failed"}[10m]) > 0
            labels:
              severity: warning
              component: sentinel-self-monitoring
            annotations:
              summary: "Sentinel receiver delivery failed"
          - alert: PinLogSentinelDeadLetterAdded
            expr: |
              delta(pinlog_sentinel_receiver_dead_letters[10m]) > 0
            labels:
              severity: warning
              component: sentinel-self-monitoring
            annotations:
              summary: "Sentinel receiver added a dead letter"
          - alert: PinLogSentinelInputRejectedOrBusy
            expr: |
              sum(increase(pinlog_sentinel_receiver_events_total{result=~"rejected|busy"}[10m])) > 0
            labels:
              severity: warning
              component: sentinel-self-monitoring
            annotations:
              summary: "Sentinel receiver rejected input or was busy"
  pinlog-aggregated-api-availability:
    groups:
      - name: pinlog-aggregated-api-availability
        rules:
          - alert: KubeAggregatedAPIDown
            expr: |
              (1 - max by (name, namespace, cluster) (
                avg_over_time(aggregator_unavailable_apiservice{
                  job="apiserver", name!="v1beta1.metrics.k8s.io"
                }[10m])
              )) * 100 < 85
            for: 5m
            labels:
              severity: warning
            annotations:
              description: "Kubernetes aggregated API {{ $labels.name }}/{{ $labels.namespace }} has been only {{ $value | humanize }}% available over the last 10m on cluster {{ $labels.cluster }}."
              runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeaggregatedapidown
              summary: "Kubernetes aggregated API is down."
  pinlog-resource-guardrails:
    groups:
      - name: pinlog-resource-guardrails
        rules:
          - alert: PinLogProdQuotaHigh
            expr: |
              max by (namespace, resource) (
                kube_resourcequota{namespace="pinlog-prod", type="used"}
                / ignoring(type)
                kube_resourcequota{namespace="pinlog-prod", type="hard"}
              ) > 0.8
            for: 10m
            labels:
              severity: warning
              component: resource-governance
            annotations:
              summary: "pinlog-prod quota 사용률 80% 초과"
              description: "{{ $labels.resource }} quota 사용률이 10분 이상 80%를 초과했습니다. 증설 또는 workload 조정이 필요합니다."
          - alert: PinLogProdContainerOOMKilled
            expr: |
              (
                kube_pod_container_status_last_terminated_reason{
                  namespace="pinlog-prod", reason="OOMKilled"
                } == 1
              )
              and on (namespace, pod, container)
              (
                time() - kube_pod_container_status_last_terminated_timestamp{
                  namespace="pinlog-prod"
                } < 600
              )
            labels:
              severity: warning
              component: resource-governance
            annotations:
              summary: "pinlog-prod 컨테이너 OOMKilled"
              description: "{{ $labels.pod }}/{{ $labels.container }}가 최근 10분 내 메모리 한도를 초과해 종료됐습니다."
          - alert: PinLogProdPodUnschedulable
            expr: |
              kube_pod_status_unschedulable{namespace="pinlog-prod"} == 1
            for: 5m
            labels:
              severity: warning
              component: resource-governance
            annotations:
              summary: "pinlog-prod Pod 스케줄 실패"
              description: "{{ $labels.pod }}가 5분 이상 스케줄되지 않았습니다. quota·requests·노드 여유 용량을 확인하세요."

# ── k3s에서 동작하지 않는 컴포넌트 ──
# k3s는 control-plane 구성요소를 별도 프로세스로 노출하지 않고 단일 바이너리
# 안에서 돌린다. 켜두면 ServiceMonitor가 붙을 대상이 없어 Prometheus의
# Targets 화면이 영구히 빨간 상태가 되고, 진짜 장애를 가린다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# cri-dockerd가 Docker stats를 계산하는 kubelet cAdvisor/resource endpoint는
# 이 burstable 단일 노드에서 stateful workload를 굶겼다. Pod 상태는
# kube-state-metrics, 호스트 상태는 node-exporter로 유지한다.
kubelet:
  serviceMonitor:
    interval: 120s
    scrapeTimeout: 30s
    cAdvisor: false
    probes: false
    resource: false

prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    scrapeTimeout: 15s
    evaluationInterval: 60s
    retention: 3d
    retentionSize: 4GB

    # 기본값(true)이면 이 Helm 릴리스 라벨이 붙은 ServiceMonitor만 수집한다.
    # 우리 마이크로서비스 차트가 만드는 ServiceMonitor는 그 라벨이 없으므로
    # false로 두지 않으면 애플리케이션 메트릭이 전혀 수집되지 않는다.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    # Sentinel host receiver는 ExternalName Service라 Endpoints 기반 ServiceMonitor로
    # 발견할 수 없다. static ScrapeConfig만 정확히 선택하도록 label contract를
    # chart implicit default가 아니라 values에 고정한다.
    scrapeConfigSelector:
      matchLabels:
        release: kube-prometheus-stack

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 12Gi

    resources:
      requests:
        memory: 768Mi
        cpu: 100m
      limits:
        # Prometheus 메모리는 활성 시리즈 수에 비례한다.
        # 서비스가 늘면 이 값을 올려야 할 수 있다 (runbook 참고).
        memory: 1536Mi
        cpu: 400m

prometheusOperator:
  admissionWebhooks:
    patch:
      resources:
        requests:
          memory: 32Mi
          cpu: 10m
        limits:
          memory: 128Mi
          cpu: 100m
  resources:
    requests:
      memory: 64Mi
      cpu: 25m
    limits:
      memory: 192Mi
      cpu: 100m
  prometheusConfigReloader:
    resources:
      requests:
        memory: 32Mi
        cpu: 5m
      limits:
        memory: 96Mi
        cpu: 50m

kube-state-metrics:
  resources:
    requests:
      memory: 48Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 75m

prometheus-node-exporter:
  resources:
    requests:
      memory: 24Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 75m

grafana:
  enabled: true
  # Phase C: Prometheus·Loki·Alloy의 단계별 5분 gate 통과 후 UI를 활성화한다.
  replicas: 1
  initChownData:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 50m
  # 비밀번호는 SealedSecret으로 관리한다 (secrets/monitoring/).
  # 이 저장소는 public이므로 평문을 절대 두지 않는다.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

  # Canonical public URL is the dedicated Cloudflare hostname. Rollback requires
  # a reviewed Git revert restoring the old root_url and serve_from_sub_path=true
  # before connector/Public Hostname shutdown. The retained ingress avoids route
  # recreation; with these desired values it is not an instant live fallback.
  grafana.ini:
    server:
      root_url: https://monitoring.pin-log.com
      serve_from_sub_path: false
    analytics:
      reporting_enabled: false
      check_for_updates: false
    users:
      # 공개 경로이므로 자가 가입을 막는다.
      allow_sign_up: false
    auth.anonymous:
      enabled: false

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - i15a705.p.ssafy.io
    path: /grafana
    pathType: Prefix
    # secretName을 지정하지 않는다 — Traefik 기본 TLSStore가
    # 와일드카드 인증서를 모든 네임스페이스에 제공한다.
    tls:
      - hosts:
          - i15a705.p.ssafy.io

  sidecar:
    resources:
      requests:
        memory: 64Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 50m
    datasources:
      # Alertmanager를 Grafana 데이터소스로 프로비저닝한다.
      alertmanager:
        enabled: true

  # Loki를 데이터소스로 자동 등록. Prometheus는 차트가 알아서 등록한다.
  additionalDataSources:
    - name: Loki
      # 기존 live datasource identity를 유지해 dashboard reference가 끊기지 않게 한다.
      uid: P8E80F9AEF21F6940
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        maxLines: 1000

  # 기본 대시보드(쿠버네티스 클러스터/노드/파드)를 자동으로 넣어준다.
  defaultDashboardsEnabled: true

  resources:
    requests:
      memory: 128Mi
      cpu: 25m
    limits:
      memory: 256Mi
      cpu: 150m
