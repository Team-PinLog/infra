apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: pinlog-operations-dashboard
    namespace: monitoring
    files:
      - pinlog-operations.json=pinlog-operations.dashboard
