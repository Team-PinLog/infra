apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: pinlog-operations-dashboard
    namespace: monitoring
    files:
      - pinlog-operations.json=pinlog-operations.dashboard
  - name: pinlog-area-logs-dashboards
    namespace: monitoring
    files:
      - pinlog-area-logs.json=pinlog-area-logs.dashboard
      - pinlog-frontend-logs.json=pinlog-frontend-logs.dashboard
      - pinlog-backend-logs.json=pinlog-backend-logs.dashboard
      - pinlog-ai-logs.json=pinlog-ai-logs.dashboard
      - pinlog-infra-logs.json=pinlog-infra-logs.dashboard
