# Grafana Alloy — 파드 로그 수집기
#
# Promtail 대신 쓴다. Promtail 차트는 공식적으로 deprecated 상태이고
# (helm show chart grafana/promtail → deprecated: true)
# Grafana가 후속으로 Alloy를 지정했다.
#
# 로그는 Kubernetes API를 통해 읽는다(loki.source.kubernetes).
# 호스트 /var/log 마운트 방식보다 권한 요구가 적고 k3s에서 안정적이다.

# chart 기본 ClusterRole은 Secret·ConfigMap·Prometheus CRD·node metrics까지 읽는다.
# 이 pipeline은 pod discovery와 pod log tail만 사용하므로 exact 최소권한만 허용한다.
rbac:
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
  # chart 1.10.1은 rules/clusterRules 중 하나를 []로 두면 `rules:` 아래에
  # 독립 `[]`을 렌더링한다. namespace read를 별도 exact rule로 분리한다.
  clusterRules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch"]

controller:
  type: daemonset

alloy:
  # UI는 노출하지 않는다. 디버깅이 필요하면 port-forward로 접근한다.
  #   kubectl -n monitoring port-forward ds/alloy 12345:12345
  listenPort: 12345

  resources:
    requests:
      memory: 96Mi
      cpu: 25m
    limits:
      memory: 192Mi
      cpu: 150m

  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // area는 승인된 네 영역에만 부여한다. 매칭되지 않은 파드는 수집하되 area가 없다.
      // 사용자·요청 식별자나 메시지는 Loki label로 승격하지 않는다.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "workload"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "workload"
          replacement   = "$1"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "pinlog-dev"
          target_label  = "environment"
          replacement   = "dev"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "pinlog-prod"
          target_label  = "environment"
          replacement   = "prod"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "(argocd|monitoring|kube-system)"
          target_label  = "environment"
          replacement   = "platform"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "pinlog-dev;front"
          target_label  = "area"
          replacement   = "frontend"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "pinlog-prod;back"
          target_label  = "area"
          replacement   = "backend"
        }
        // apps/dev/ai 선언과 동일한 selector라서 향후 배포 시 자동 분류된다.
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "pinlog-(dev|prod);ai"
          target_label  = "area"
          replacement   = "ai"
        }
        // Infra exact allowlist: 두 전용 namespace, kube-system의 두 앱, dev tunnel만 허용.
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(argocd|monitoring);.+|kube-system;(traefik|sealed-secrets)|pinlog-dev;(cowork-cloudflared|pinlog-web-cloudflared)"
          target_label  = "area"
          replacement   = "infra"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.drop_noise.receiver]
      }

      loki.process "drop_noise" {
        forward_to = [loki.process.sanitize.receiver]

        stage.drop {
          expression = ".*(actuator/health|/healthz|kube-probe).*"
          drop_counter_reason = "healthcheck"
        }
      }

      // 원문 유용성(route/status/error class)은 유지하고 credential/PII 값만 치환한다.
      loki.process "sanitize" {
        forward_to = [loki.write.default.receiver]

        stage.replace {
          expression = `(?i)(Authorization\s*["']?\s*[:=]\s*["']?\s*)(?:Bearer\s+)?[^\s,;"'}]+`
          replace    = `${1}[REDACTED]`
        }
        stage.replace {
          expression = `(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+`
          replace    = `${1}[REDACTED]`
        }
        stage.replace {
          expression = `(?i)((?:Cookie|Set-Cookie)\s*["']?\s*[:=]\s*["']?\s*)[^;\s,"'}]+(?:\s*;\s*[^;\s,"'}]+)*`
          replace    = `${1}[REDACTED]`
        }
        stage.replace {
          expression = `(?i)((?:code|state|access_token|refresh_token|id_token|client_secret)\s*["']?\s*[=:]\s*["']?\s*)[^&\s,;"'}]+`
          replace    = `${1}[REDACTED]`
        }
        stage.replace {
          expression = `eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}`
          replace    = `[REDACTED]`
        }
        stage.replace {
          expression = `[A-Za-z0-9.!#$%&'*+/=?^_{}|~-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+`
          replace    = `[REDACTED]`
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

configReloader:
  resources:
    requests:
      memory: 32Mi
      cpu: 5m
    limits:
      memory: 64Mi
      cpu: 50m
