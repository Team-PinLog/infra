apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-console
  namespace: pinlog-dev
  labels:
    app.kubernetes.io/name: api-console
    app.kubernetes.io/instance: api-console
    app.kubernetes.io/part-of: pinlog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api-console
      app.kubernetes.io/instance: api-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-console
        app.kubernetes.io/instance: api-console
        app.kubernetes.io/part-of: pinlog
        networking.pinlog.io/ingress: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-swagger-ui
          image: swaggerapi/swagger-ui:v5.29.5@sha256:02afc8d2c5199ea5b0bd47645084e77a550608f64ecea0a21d2c62a6fc1f9757
          command: ["sh", "-c", "cp -R /usr/share/nginx/html/. /swagger-ui/"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: swagger-ui
              mountPath: /swagger-ui
      containers:
        - name: swagger-ui
          image: swaggerapi/swagger-ui:v5.29.5@sha256:02afc8d2c5199ea5b0bd47645084e77a550608f64ecea0a21d2c62a6fc1f9757
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: /api-console
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api-console/
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /api-console/
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api-console/
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: swagger-ui
              mountPath: /usr/share/nginx/html
            - name: pinlog-config
              mountPath: /pinlog-config
              readOnly: true
            - name: pinlog-config
              mountPath: /docker-entrypoint.d/50-pinlog-config.sh
              subPath: 50-pinlog-config.sh
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: swagger-ui
          emptyDir:
            sizeLimit: 32Mi
        - name: pinlog-config
          configMap:
            name: api-console
            defaultMode: 0555
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
