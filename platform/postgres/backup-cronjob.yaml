# PostgreSQL 일일 백업
#
#   ***  이것만으로는 부족하다  ***
#
# 이 백업은 DB와 "같은 디스크"에 저장된다.
# 실수로 DROP TABLE 한 건 막아주지만, 서버를 잃는 건 못 막는다.
# 이 서버는 단일 노드 / 단일 디스크이고 SSAFY가 재이미징할 수 있다.
#
# 주 1회 서버 밖으로 복사하는 것을 스프린트 체크리스트에 넣고
# 담당자 이름을 지정할 것:
#
#   scp ubuntu@i15a705.p.ssafy.io:/var/lib/rancher/k3s/storage/<백업PVC경로>/latest.dump ./
#
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup
  namespace: pinlog-prod
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: pinlog-prod
spec:
  # 매일 새벽 4시 (KST 아님 — 컨테이너는 UTC. 필요하면 조정)
  schedule: "0 19 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: pinlog-master
          containers:
            - name: pg-dump
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  BACKUP_DIR=${BACKUP_DIR:-/backup}
                  TS=$(date +%Y%m%d-%H%M%S)
                  FINAL="${BACKUP_DIR}/pinlog-${TS}.dump"
                  PARTIAL=""
                  LATEST_TMP=""

                  cleanup() {
                    status=$?
                    trap - EXIT
                    [ -z "${PARTIAL}" ] || rm -f -- "${PARTIAL}"
                    [ -z "${LATEST_TMP}" ] || rm -f -- "${LATEST_TMP}"
                    exit "${status}"
                  }
                  trap cleanup EXIT
                  trap 'exit 129' HUP
                  trap 'exit 130' INT
                  trap 'exit 143' TERM

                  exec 9<"${BACKUP_DIR}"
                  if ! flock -n 9; then
                    echo "다른 백업 실행이 진행 중입니다 — 실패 처리" >&2
                    exit 1
                  fi

                  if [ -e "${FINAL}" ] || [ -L "${FINAL}" ]; then
                    echo "동일 이름의 백업 artifact가 이미 있습니다 — 실패 처리" >&2
                    exit 1
                  fi
                  PARTIAL=$(mktemp "${BACKUP_DIR}/.pinlog-${TS}.dump.partial.XXXXXX")

                  echo "백업 시작: ${FINAL}"
                  pg_dump -h postgres -U pinlog -d pinlog -Fc -f "${PARTIAL}"

                  if [ ! -s "${PARTIAL}" ]; then
                    echo "덤프가 비어 있습니다 — 실패 처리" >&2
                    exit 1
                  fi
                  if ! pg_restore --list "${PARTIAL}" >/dev/null; then
                    echo "덤프 archive 검증 실패" >&2
                    exit 1
                  fi

                  if ! ln -- "${PARTIAL}" "${FINAL}"; then
                    echo "동일 이름의 백업 artifact가 이미 있습니다 — 실패 처리" >&2
                    exit 1
                  fi
                  rm -f -- "${PARTIAL}"
                  PARTIAL=""

                  LATEST_TMP=$(mktemp "${BACKUP_DIR}/.latest.dump.tmp.XXXXXX")
                  rm -f -- "${LATEST_TMP}"
                  ln -s "${FINAL##*/}" "${LATEST_TMP}"
                  mv -f -- "${LATEST_TMP}" "${BACKUP_DIR}/latest.dump"
                  LATEST_TMP=""

                  echo "백업 완료: $(du -h "${FINAL}" | cut -f1)"

                  # 검증 후 publish된 final archive만 7일 보관 정책을 적용한다.
                  find "${BACKUP_DIR}" -type f \
                    -name 'pinlog-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9][0-9][0-9].dump' \
                    -mtime +7 -delete
                  echo "현재 백업 목록:"
                  ls -lh "${BACKUP_DIR}/"
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: 500m
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: postgres-backup
