apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-ai-public-schema-usage-v2
  namespace: pinlog-prod
  labels:
    app.kubernetes.io/name: postgres-ai-shared-db-bootstrap
    app.kubernetes.io/part-of: pinlog
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-ai-shared-db-bootstrap
        app.kubernetes.io/part-of: pinlog
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: pinlog-master
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          command: ["psql"]
          args:
            - -X
            - -v
            - ON_ERROR_STOP=1
            - -h
            - postgres.pinlog-prod.svc.cluster.local
            - -U
            - pinlog
            - -d
            - pinlog
            - -f
            - /bootstrap/bootstrap.sql
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: bootstrap
          configMap:
            name: postgres-ai-public-schema-usage-v2
