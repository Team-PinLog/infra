name: ai-token-capability-probe

on:
  push:
    branches:
      - fix/S15P11A705-61-ai-image-automation

permissions:
  contents: read

jobs:
  status-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Probe source, package, and Infra PR capability without exposing the token
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          REGISTRY_USERNAME: ${{ vars.PINLOG_IMAGE_UPDATER_USERNAME }}
          SOURCE_SHA: 4d667c3ee5635c9fee703a66a3dbfb0b056621b0
          IMAGE_DIGEST: sha256:3fbe59d342b5649a9b94156d180fa80841b78254393389ef73749b0d0e7f0048
        run: |
          set -euo pipefail
          set +x
          test -n "$GH_TOKEN"
          test -n "$REGISTRY_USERNAME"

          test "$(gh api repos/Team-PinLog/ai/git/ref/heads/main --jq '.object.sha')" = "$SOURCE_SHA"
          gh api "repos/Team-PinLog/ai/actions/workflows/ai-ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' | grep -Fx "$SOURCE_SHA" >/dev/null
          gh api repos/Team-PinLog/ai/actions/runs/30629684387/artifacts \
            --jq '.artifacts[] | select(.name == "ai-image-provenance" and .expired == false) | .id' \
            | grep -E '^[0-9]+$' >/dev/null

          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -m 700 "$DOCKER_CONFIG"
          probe_branch="automation/ai-token-probe-${GITHUB_RUN_ID}"
          pr_number=""
          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf "$DOCKER_CONFIG"
            if [ -n "$pr_number" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr_number" -f state=closed >/dev/null 2>&1 || true
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$probe_branch" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin >/dev/null
          docker buildx imagetools inspect "ghcr.io/team-pinlog/ai:$SOURCE_SHA" >/dev/null
          docker buildx imagetools inspect "ghcr.io/team-pinlog/ai@$IMAGE_DIGEST" >/dev/null

          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$probe_branch" -f "sha=$GITHUB_SHA" >/dev/null
          pr_number=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title='AI updater token capability probe' \
            -f "head=$probe_branch" -f base=main -F draft=true \
            --jq '.number')
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.state' | grep -Fx open >/dev/null

          echo 'source_read=pass'
          echo 'actions_artifact_read=pass'
          echo 'ai_package_read=pass'
          echo 'infra_pr_create=pass'
