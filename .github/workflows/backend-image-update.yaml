name: backend-image-update

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-image-update
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: Team-PinLog/back
  SOURCE_BRANCH: dev
  SOURCE_WORKFLOW: backend-ci.yml
  IMAGE_REPOSITORY: ghcr.io/team-pinlog/back
  VALUES_PATH: apps/prod/back/values.yaml
  UPDATE_BRANCH: automation/backend-image-update

jobs:
  detect-source:
    name: Backend · 1 Detect source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Validate credentials and detect Backend dev HEAD
        id: source
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          REGISTRY_USERNAME: ${{ vars.PINLOG_IMAGE_UPDATER_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$REGISTRY_USERNAME"
          source_sha=$(gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha')
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  verify-source-ci:
    name: Backend · 2 Verify source CI
    needs: detect-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate: ${{ steps.run.outputs.candidate }}
      run_id: ${{ steps.run.outputs.run_id }}
    steps:
      - name: Bind the successful Backend publish run to detected HEAD
        id: run
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          SOURCE_SHA: ${{ needs.detect-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json=$(gh api "repos/$SOURCE_REPOSITORY/actions/workflows/$SOURCE_WORKFLOW/runs?branch=$SOURCE_BRANCH&event=push&status=success&per_page=1")
          run_sha=$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].head_sha // empty')
          run_id=$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].id // empty')
          if [ "$run_sha" != "$SOURCE_SHA" ]; then
            echo "No successful image exists for the detected Backend source HEAD"
            echo "candidate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].status // empty')" = completed
          test "$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].conclusion // empty')" = success
          test "$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].event // empty')" = push
          test "$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].head_branch // empty')" = "$SOURCE_BRANCH"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "candidate=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  verify-image:
    name: Backend · 3 Verify immutable image
    needs: [detect-source, verify-source-ci]
    if: ${{ needs.verify-source-ci.outputs.candidate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Match the run-bound digest with private GHCR
        id: image
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          REGISTRY_USERNAME: ${{ vars.PINLOG_IMAGE_UPDATER_USERNAME }}
          SOURCE_SHA: ${{ needs.detect-source.outputs.source_sha }}
          RUN_ID: ${{ needs.verify-source-ci.outputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          published_digest=$(gh run view "$RUN_ID" --repo "$SOURCE_REPOSITORY" --log \
            | python3 tools/extract_backend_publish_digest.py)
          [[ "$published_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
          inspection=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$SOURCE_SHA")
          digest=$(printf '%s\n' "$inspection" | python3 -c 'import re,sys; match=re.search(r"(?m)^Digest:\s+(sha256:[0-9a-f]{64})$", sys.stdin.read()); print(match.group(1) if match else "")')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$digest" = "$published_digest"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" >/dev/null
          echo "tag=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  create-infra-pr:
    name: Backend · 4 Create Infra PR
    needs: [detect-source, verify-source-ci, verify-image]
    if: >-
      always() &&
      needs.detect-source.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Close a stale updater PR after an upstream verification failure
        if: >-
          needs.verify-source-ci.result != 'success' ||
          (needs.verify-source-ci.outputs.candidate == 'true' && needs.verify-image.result != 'success')
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Backend source CI 또는 immutable image 검증이 실패해 stale 자동 PR을 닫습니다."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.verify-source-ci.outputs.candidate == 'true' && needs.verify-image.result == 'success' }}
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ needs.verify-source-ci.outputs.candidate == 'true' && needs.verify-image.result == 'success' }}
        with:
          python-version: "3.12"
      - name: Install hash-locked test dependencies
        if: ${{ needs.verify-source-ci.outputs.candidate == 'true' && needs.verify-image.result == 'success' }}
        run: python -m pip install --require-hashes -r .github/requirements-guardrails.txt
      - name: Close a stale updater PR when there is no current candidate
        if: ${{ needs.verify-source-ci.outputs.candidate == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "현재 Backend source HEAD에 merge 가능한 successful image가 없어 stale 자동 PR을 닫습니다."
          fi
      - name: RED candidate contract before values update
        id: change
        if: ${{ needs.verify-source-ci.outputs.candidate == 'true' && needs.verify-image.result == 'success' }}
        env:
          BACKEND_IMAGE_TAG: ${{ needs.verify-image.outputs.tag }}
          BACKEND_IMAGE_DIGEST: ${{ needs.verify-image.outputs.digest }}
        run: |
          set -euo pipefail
          red_log="$RUNNER_TEMP/backend-image-red.log"
          set +e
          python -m unittest -v tests.test_backend_image_candidate >"$red_log" 2>&1
          red_status=$?
          set -e
          cat "$red_log"
          if [ "$red_status" -eq 0 ]; then
            echo "Backend values already match the verified image"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$red_status" -eq 1
          grep -F 'AssertionError' "$red_log" >/dev/null
          grep -F "$BACKEND_IMAGE_TAG" "$red_log" >/dev/null
          grep -F "$BACKEND_IMAGE_DIGEST" "$red_log" >/dev/null
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Close a stale updater PR when values already match
        if: ${{ needs.verify-source-ci.outputs.candidate == 'true' && steps.change.outputs.changed == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "Backend values가 이미 검증된 image와 일치해 stale 자동 PR을 닫습니다."
          fi
      - name: Update only the Backend immutable image fields
        if: ${{ steps.change.outputs.changed == 'true' }}
        env:
          BACKEND_IMAGE_TAG: ${{ needs.verify-image.outputs.tag }}
          BACKEND_IMAGE_DIGEST: ${{ needs.verify-image.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(python tools/update_backend_image.py --values "$VALUES_PATH" --tag "$BACKEND_IMAGE_TAG" --digest "$BACKEND_IMAGE_DIGEST")" = changed=true
      - name: GREEN candidate contract and regression suite
        if: ${{ steps.change.outputs.changed == 'true' }}
        env:
          BACKEND_IMAGE_TAG: ${{ needs.verify-image.outputs.tag }}
          BACKEND_IMAGE_DIGEST: ${{ needs.verify-image.outputs.digest }}
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_backend_image_candidate
          python -m unittest discover -s tests -v
      - name: Disable inherited auto-merge before updating the fixed branch
        if: ${{ steps.change.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            enabled=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$enabled" = true ]; then
              gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto
              test "$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest == null')" = true
            fi
          fi
      - name: Recheck source HEAD immediately before creating the PR
        if: ${{ steps.change.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          EXPECTED_SHA: ${{ needs.verify-image.outputs.tag }}
        run: test "$(gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha')" = "$EXPECTED_SHA"
      - name: Create or update the guarded image PR
        id: create-pr
        if: ${{ steps.change.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          base: main
          branch: automation/backend-image-update
          delete-branch: true
          add-paths: apps/prod/back/values.yaml
          commit-message: "[verified] chore(S15P11A705-50): update Backend immutable image"
          title: "S15P11A705-50 Backend immutable image 자동 갱신"
          body: |
            ## Summary

            - Backend `dev`의 현재 commit이 successful `backend-ci.yml` push run인지 확인했습니다.
            - private GHCR에서 `${{ needs.verify-image.outputs.tag }}@${{ needs.verify-image.outputs.digest }}` manifest를 검증했습니다.
            - Backend 운영 values의 image tag/digest만 변경합니다.

            ## Jira

            Jira: S15P11A705-50

            ## TDD Evidence

            RED: candidate 환경변수를 설정한 뒤 `python -m unittest -v tests.test_backend_image_candidate`를 values 변경 전에 실행해 candidate expectation failure를 확인했습니다. exit 1.

            GREEN: 동일 candidate 환경변수로 `python -m unittest -v tests.test_backend_image_candidate`를 values 변경 후 실행해 통과했습니다. exit 0.

            Regression: `python -m unittest discover -s tests -v` 전체 suite가 통과했습니다. exit 0.

            ## Operational Impact

            - 필수 PR checks 성공 후 trusted workflow가 source와 exact head를 재검증하고 즉시 squash merge합니다.
            - Argo CD는 `maxUnavailable: 0` RollingUpdate로 새 Pod가 Ready가 되기 전 기존 Pod를 유지합니다.
            - 실패 시 PR checks 또는 manifest 검증에서 중단되며 현재 image 값은 유지됩니다.

            ## Checklist

            - [x] 기능별 automation branch를 사용합니다.
            - [x] main에 직접 push하지 않습니다.
            - [x] immutable SHA tag와 digest를 함께 검증했습니다.
            - [x] 비밀값을 PR에 기록하지 않습니다.
      - name: Remove a stale updater PR after a failed update attempt
        if: ${{ always() && needs.verify-source-ci.outputs.candidate == 'true' && steps.create-pr.outcome != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "자동 image 검증 또는 PR 갱신이 실패해 stale 자동 PR을 닫습니다."
          fi
