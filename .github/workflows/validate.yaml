# Infra repository validation. Keep guardrails/helm job IDs stable because they are
# protected-branch required checks; internal render work is split into parallel nodes.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Install hash-locked guardrail dependencies
        run: python -m pip install --require-hashes -r .github/requirements-guardrails.txt
      - name: TDD contracts and repository regression suite
        run: python -m unittest discover -s tests -v

  helm-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Helm chart lint
        run: helm lint charts/microservice

  monitoring-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Install hash-locked render validator dependencies
        run: python -m pip install --require-hashes -r .github/requirements-guardrails.txt
      - name: Install checksum-verified kubeconform
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin kubeconform
      - name: Monitoring pinned render, resource and schema contracts
        run: |
          set -euo pipefail
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts

          prometheus_render="$RUNNER_TEMP/kube-prometheus-stack.yaml"
          loki_render="$RUNNER_TEMP/loki.yaml"
          alloy_render="$RUNNER_TEMP/alloy.yaml"
          rules_file="$RUNNER_TEMP/pinlog-resource-rules.yaml"

          helm template kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            --version 87.17.0 --namespace monitoring \
            -f platform/monitoring/kube-prometheus-stack-values.yaml > "$prometheus_render"
          helm template loki grafana/loki \
            --version 7.1.0 --namespace monitoring \
            -f platform/monitoring/loki-values.yaml > "$loki_render"
          helm template alloy grafana/alloy \
            --version 1.10.1 --namespace monitoring \
            -f platform/monitoring/alloy-values.yaml > "$alloy_render"

          python3 tools/validate_rendered_resource_guardrails.py \
            --prometheus "$prometheus_render" \
            --loki "$loki_render" \
            --alloy "$alloy_render" \
            --rules-output "$rules_file"

          archive="$RUNNER_TEMP/prometheus-3.13.1.linux-amd64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v3.13.1/prometheus-3.13.1.linux-amd64.tar.gz"
          echo "962b812371aff838d152b6ff2d56fdb7a6396f5542f48ebf73421b9721f0d103  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/prometheus-3.13.1.linux-amd64/promtool" check rules "$rules_file"

          for rendered in "$prometheus_render" "$loki_render" "$alloy_render"; do
            kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default "$rendered"
          done

  service-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Install checksum-verified kubeconform
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin kubeconform
      - name: Render every service and validate Kubernetes schemas
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          count=0
          for values in apps/*/*/values.yaml; do
            count=$((count+1))
            env=$(basename "$(dirname "$(dirname "$values")")")
            svc=$(basename "$(dirname "$values")")
            echo "::group::$env/$svc"
            if ! helm template "$svc" charts/microservice \
                   --values "$values" --namespace "pinlog-$env" \
                 | kubeconform -strict -summary \
                     -schema-location default \
                     -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'; then
              echo "::error::$env/$svc validation failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          test "$count" -gt 0
          exit "$fail"

  platform-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-verified kubeconform
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz"
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin kubeconform
      - name: Validate platform and Argo CD manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -ignore-filename-pattern '.*-values\.yaml$' \
            platform/ argocd/

  helm:
    if: ${{ always() }}
    needs: [helm-lint, monitoring-render, service-render, platform-schema]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the stable required Helm check
        run: |
          test "${{ needs.helm-lint.result }}" = success
          test "${{ needs.monitoring-render.result }}" = success
          test "${{ needs.service-render.result }}" = success
          test "${{ needs.platform-schema.result }}" = success

  ci-gate:
    if: ${{ always() }}
    needs: [guardrails, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate all Infra validation nodes
        run: |
          test "${{ needs.guardrails.result }}" = success
          test "${{ needs.helm.result }}" = success
