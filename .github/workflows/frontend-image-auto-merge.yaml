name: frontend-image-auto-merge

on:
  workflow_run:
    workflows: ["validate"]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  verify-and-merge:
    if: >-
      vars.FRONTEND_IMAGE_AUTO_MERGE_APPROVED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'automation/frontend-image-update'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      SOURCE_REPOSITORY: Team-PinLog/front
      SOURCE_WORKFLOW: ci.yml
      IMAGE_REPOSITORY: ghcr.io/team-pinlog/front
      EXPECTED_HEAD_REF: automation/frontend-image-update
      VALUES_PATH: apps/dev/front/values.yaml
      REQUIRED_CHECKS: guardrails helm pr-policy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Reverify source image and merge the exact PR head
        env:
          SOURCE_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          SOURCE_USERNAME: ${{ vars.PINLOG_IMAGE_UPDATER_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN"
          test -n "$SOURCE_USERNAME"
          test "$RUN_HEAD_BRANCH" = "$EXPECTED_HEAD_REF"
          [[ "$RUN_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          open_prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open \
            -f head="Team-PinLog:$EXPECTED_HEAD_REF")
          test "$(printf '%s' "$open_prs" | jq 'length')" -eq 1
          PR_NUMBER=$(printf '%s' "$open_prs" | jq -r '.[0].number')
          HEAD_SHA=$(printf '%s' "$open_prs" | jq -r '.[0].head.sha')
          export HEAD_SHA
          test "$HEAD_SHA" = "$RUN_HEAD_SHA"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          test "$(printf '%s' "$pr_json" | jq -r '.state')" = open
          test "$(printf '%s' "$pr_json" | jq -r '.draft')" = false
          test "$(printf '%s' "$pr_json" | jq -r '.base.ref')" = main
          test "$(printf '%s' "$pr_json" | jq -r '.head.ref')" = "$EXPECTED_HEAD_REF"
          test "$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name')" = "$GITHUB_REPOSITORY"
          test "$(printf '%s' "$pr_json" | jq -r '.head.sha')" = "$HEAD_SHA"

          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          test "$files" = "$VALUES_PATH"

          values_file="$RUNNER_TEMP/frontend-values.yaml"
          gh api "repos/$GITHUB_REPOSITORY/contents/$VALUES_PATH?ref=$HEAD_SHA" \
            -H 'Accept: application/vnd.github.raw+json' > "$values_file"
          mapfile -t image < <(
            python3 tools/update_frontend_image.py \
              --values "$values_file" \
              --inspect
          )
          test "${#image[@]}" -eq 3
          test "${image[0]}" = "$IMAGE_REPOSITORY"
          tag=${image[1]}
          digest=${image[2]}
          [[ "$tag" =~ ^[0-9a-f]{40}-cfg-[0-9a-f]{20}-run-[1-9][0-9]*-a[1-9][0-9]*$ ]]
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          current_main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$(git rev-parse HEAD)" = "$current_main"
          expected_values="$RUNNER_TEMP/expected-frontend-values.yaml"
          cp "$VALUES_PATH" "$expected_values"
          update_result=$(python3 tools/update_frontend_image.py \
            --values "$expected_values" \
            --tag "$tag" \
            --digest "$digest")
          test "$update_result" = changed=true
          cmp --silent "$expected_values" "$values_file"

          dev_sha=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')
          source_sha=${tag:0:40}
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$source_sha" = "$dev_sha"
          run_json=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/actions/workflows/$SOURCE_WORKFLOW/runs?branch=dev&status=success&per_page=100")
          run_id=$(printf '%s' "$run_json" | python3 tools/validate_frontend_provenance.py select-run --source-sha "$dev_sha")
          [[ "$run_id" =~ ^[0-9]+$ ]]
          run_details=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id")
          run_attempt=$(printf '%s' "$run_details" | jq -er '.run_attempt | select(type == "number" and . >= 1 and floor == .)')
          jobs=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          test "$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name == "frontend-image / publish" and .status == "completed" and .conclusion == "success")] | length')" -eq 1
          test "$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name == "frontend-image / publish")] | length')" -eq 1
          artifact_json=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")
          artifact_id=$(printf '%s' "$artifact_json" | jq -er --argjson run_id "$run_id" '[.artifacts[] | select(.name == "frontend-image-provenance" and .expired == false and ((.workflow_run.id? // $run_id) == $run_id))] | if length == 1 then .[0].id else error("expected exact run-bound provenance artifact") end')
          archive="$RUNNER_TEMP/frontend-provenance.zip"
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          provenance="$RUNNER_TEMP/frontend-image-provenance.json"
          python3 tools/extract_frontend_provenance_artifact.py "$archive" "$provenance"
          printf '%s' "$SOURCE_TOKEN" | docker login ghcr.io --username "$SOURCE_USERNAME" --password-stdin
          inspection=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$tag")
          resolved_digest=$(printf '%s\n' "$inspection" | python3 -c 'import re,sys; match=re.search(r"(?m)^Digest:\s+(sha256:[0-9a-f]{64})$", sys.stdin.read()); print(match.group(1) if match else "")')
          test "$resolved_digest" = "$digest"
          mapfile -t trusted < <(python3 tools/validate_frontend_provenance.py validate "$provenance" --run-id "$run_id" --run-attempt "$run_attempt" --source-sha "$dev_sha" --registry-digest "$resolved_digest")
          test "${trusted[0]}" = "$tag"
          test "${trusted[1]}" = "$digest"
          test "${trusted[2]}" = "$dev_sha"
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" >/dev/null

          checks_ready=false
          for attempt in $(seq 1 24); do
            test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" = "$HEAD_SHA"
            checks_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")
            checks_ready=true
            for required in $REQUIRED_CHECKS; do
              check_state=$(printf '%s' "$checks_json" | jq -r --arg required "$required" \
                '[.check_runs[] | select(
                  .name == $required and
                  .head_sha == env.HEAD_SHA and
                  .app.slug == "github-actions"
                )] as $matches |
                if ($matches | length) == 0 then "missing"
                elif all($matches[];
                  .status == "completed" and .conclusion == "success"
                ) then "ready"
                else "not-ready"
                end')
              if [ "$check_state" != ready ]; then
                checks_ready=false
              fi
            done
            if [ "$checks_ready" = true ]; then
              break
            fi
            sleep 5
          done
          test "$checks_ready" = true

          test "$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$SOURCE_REPOSITORY/git/ref/heads/dev" --jq '.object.sha')" = "$source_sha"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')" = "$HEAD_SHA"
          final_inspection=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$tag")
          final_digest=$(printf '%s\n' "$final_inspection" | python3 -c 'import re,sys; match=re.search(r"(?m)^Digest:\s+(sha256:[0-9a-f]{64})$", sys.stdin.read()); print(match.group(1) if match else "")')
          test "$final_digest" = "$digest"

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --match-head-commit "$HEAD_SHA" \
            --squash --delete-branch
