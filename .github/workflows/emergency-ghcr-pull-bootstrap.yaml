name: emergency-ghcr-pull-bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type BOOTSTRAP_GHCR_PULL_SECRETS to run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal-and-open-pr:
    if: ${{ inputs.confirm == 'BOOTSTRAP_GHCR_PULL_SECRETS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install checksum-pinned kubeseal
        env:
          KUBESEAL_VERSION: "0.38.4"
          KUBESEAL_ARCHIVE_SHA256: ab5ae808b0efcb167a825b6cf7f3a7c0034bd99a6301d78db2012da651a8c0b9
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeseal.tar.gz"
          install_dir="$RUNNER_TEMP/kubeseal"
          mkdir -m 700 "$install_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/bitnami-labs/sealed-secrets/releases/download/v${KUBESEAL_VERSION}/kubeseal-${KUBESEAL_VERSION}-linux-amd64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$KUBESEAL_ARCHIVE_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir" kubeseal
          chmod 700 "$install_dir/kubeseal"
          printf '%s\n' "$install_dir/kubeseal" > "$RUNNER_TEMP/kubeseal-path"
          rm -f "$archive"

      - name: Seal emergency GHCR pull credentials and open Infra PR
        env:
          GHCR_PULL_TOKEN: ${{ secrets.PINLOG_IMAGE_UPDATER_TOKEN }}
          REGISTRY_USERNAME: ${{ vars.PINLOG_IMAGE_UPDATER_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$GHCR_PULL_TOKEN"
          test -n "$REGISTRY_USERNAME"
          export GH_TOKEN="$GHCR_PULL_TOKEN"
          export PINLOG_KUBESEAL="$(<"$RUNNER_TEMP/kubeseal-path")"
          python3 - <<'PY'
          import json, os, pathlib, subprocess

          token = os.environ["GHCR_PULL_TOKEN"]
          username = os.environ["REGISTRY_USERNAME"]
          config = json.dumps({"auths": {"ghcr.io": {"username": username, "password": token, "auth": __import__("base64").b64encode(f"{username}:{token}".encode()).decode()}}}, separators=(",", ":"))
          cert = pathlib.Path(".github/pinlog/sealed-secrets/pinlog-dev-cert.pem")
          targets = [
              ("pinlog-prod", "ghcr-back-pull", "secrets/prod/ghcr-back-pull.sealedsecret.yaml"),
              ("pinlog-dev", "ghcr-front-pull", "secrets/dev/ghcr-front-pull.sealedsecret.yaml"),
              ("pinlog-dev", "ghcr-ai-pull", "secrets/dev/ghcr-ai-pull.sealedsecret.yaml"),
          ]
          for namespace, name, path in targets:
              sealed = subprocess.run(
                  [os.environ["PINLOG_KUBESEAL"], "--raw", "--scope", "strict", "--namespace", namespace, "--name", name, "--cert", str(cert)],
                  input=config, text=True, capture_output=True, check=True,
              ).stdout.strip()
              if not sealed.startswith("Ag"):
                  raise SystemExit("kubeseal did not return ciphertext")
              pathlib.Path(path).write_text(
                  "apiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n"
                  f"  name: {name}\n  namespace: {namespace}\nspec:\n  encryptedData:\n"
                  f"    .dockerconfigjson: {sealed}\n  template:\n    metadata:\n"
                  f"      name: {name}\n      namespace: {namespace}\n"
                  "    type: kubernetes.io/dockerconfigjson\n",
                  encoding="utf-8",
              )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/emergency-ghcr-pull-bootstrap
          git add secrets/prod/ghcr-back-pull.sealedsecret.yaml secrets/dev/ghcr-front-pull.sealedsecret.yaml secrets/dev/ghcr-ai-pull.sealedsecret.yaml
          git commit -m "chore: bootstrap emergency GHCR pull credentials"
          gh auth setup-git
          git push --force-with-lease -u origin HEAD
          gh pr create --repo Team-PinLog/infra --base main --head automation/emergency-ghcr-pull-bootstrap --draft \
            --title "chore: bootstrap emergency GHCR pull credentials" \
            --body "Ciphertext-only emergency pull credential refresh. This uses the existing image updater token temporarily; replace it with a dedicated package-read credential after service recovery."
