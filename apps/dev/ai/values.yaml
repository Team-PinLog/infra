# AI dev scaffold. 승인되지 않은 계약이 남아 있어 workload는 의도적으로 차단한다.
replicaCount: 1

application:
  enabled: false

deployment:
  enabled: false

image:
  repository: ghcr.io/team-pinlog/ai
  tag: 1ed55b817197de73e63618a3a61696da7e14b5bc
  digest: sha256:e3e27a2475eef99287d7eca013acd9bc69969a37bfc3771a03aec80d95eed592
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-ai-pull

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 180

probes:
  enabled: true
  path: /health
  startup:
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 3

# prod 전 앱 계약에 맞춘 readiness 분리와 metrics endpoint를 추가한다.
metrics:
  enabled: false

env: []
envFrom:
  - secretRef:
      name: ai-runtime-secrets

# 승인된 preset artifact 계약만 기록하며 activation 승인 전에는 실행하지 않는다.
bootstrap:
  enabled: false
  version: "preset-204824bd37e6"
  command: ["python", "-m", "app.bootstrap.load_presets"]
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
