# AI dev activation. 검증된 bootstrap 이후 Deployment를 활성화한다.
replicaCount: 1

application:
  enabled: true

deployment:
  enabled: true

image:
  repository: ghcr.io/team-pinlog/ai
  tag: d317f563c93a7980fa9e97f4c8421fddd5923d26
  digest: sha256:90fc0b64985a2cd55750992bf3df8065c798bdffaf8d3c36584b6235f9fc69cd
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-ai-pull

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 180

probes:
  enabled: true
  path: /health
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /health
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /ready
    periodSeconds: 10
    failureThreshold: 3

# prod 전 metrics endpoint를 추가한다.
metrics:
  enabled: false

env: []
envFrom:
  - secretRef:
      name: ai-owner-secrets
  - secretRef:
      name: ai-db-credentials

# 승인된 preset artifact를 Deployment보다 먼저 실행한다.
bootstrap:
  enabled: true
  version: "preset-204824bd37e6"
  command: ["python", "-m", "app.bootstrap.load_presets"]
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""

podAnnotations:
  secrets.pinlog.io/revision: ai-db-pinlog-v1
