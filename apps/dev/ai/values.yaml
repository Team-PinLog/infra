# AI dev activation. 검증된 bootstrap 이후 Deployment를 활성화한다.
replicaCount: 1

application:
  enabled: true

deployment:
  enabled: true

image:
  repository: ghcr.io/team-pinlog/ai
  tag: 7e728266eaaba6bddd1d8046690418fa7e7f19f2
  digest: sha256:7840b7fc6581f0c65a5fbd00b3d6489d811c79bb049961fdfbf1a12c31de585f
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-ai-pull

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 180

probes:
  enabled: true
  path: /health
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /health
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /ready
    periodSeconds: 10
    failureThreshold: 3

# prod 전 metrics endpoint를 추가한다.
metrics:
  enabled: false

env: []
envFrom:
  - secretRef:
      name: ai-owner-secrets
  - secretRef:
      name: ai-db-credentials

# 승인된 preset artifact를 Deployment보다 먼저 실행한다.
bootstrap:
  enabled: true
  version: "preset-204824bd37e6"
  command: ["python", "-m", "app.bootstrap.load_presets"]
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""

podAnnotations:
  provenance.pinlog.io/image-source-sha: 7e728266eaaba6bddd1d8046690418fa7e7f19f2
  provenance.pinlog.io/owner-secret-source-sha: b911e81da415fe0a902ed52c073e5f1ea29501c0
  secrets.pinlog.io/revision: ai-db-pinlog-v1
