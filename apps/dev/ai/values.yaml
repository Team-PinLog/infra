# AI dev activation. 검증된 bootstrap 이후 Deployment를 활성화한다.
replicaCount: 1

application:
  enabled: true

deployment:
  enabled: true

image:
  repository: ghcr.io/team-pinlog/ai
  tag: 0d2bdacd2451a832deddf1132c830bd6a800bd4e
  digest: sha256:33de05e1ba886a7374ce9f68520778e22fc350607887c69525dcfc8d0aad5c2b
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-ai-pull

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 180

probes:
  enabled: true
  path: /health
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /health
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /ready
    periodSeconds: 10
    failureThreshold: 3

# prod 전 metrics endpoint를 추가한다.
metrics:
  enabled: false

env: []
envFrom:
  - secretRef:
      name: ai-owner-secrets
  - secretRef:
      name: ai-db-credentials

# 승인된 preset artifact를 Deployment보다 먼저 실행한다.
bootstrap:
  enabled: true
  version: "preset-204824bd37e6"
  command: ["python", "-m", "app.bootstrap.load_presets"]
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""

podAnnotations:
  provenance.pinlog.io/image-source-sha: 0d2bdacd2451a832deddf1132c830bd6a800bd4e
  provenance.pinlog.io/owner-secret-source-sha: ec82902a5d1ca74483d3c4c9daab6ff3a4b6a3d6
  secrets.pinlog.io/revision: ai-db-pinlog-v1
