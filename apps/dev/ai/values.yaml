# AI dev scaffold. 승인되지 않은 계약이 남아 있어 workload는 의도적으로 차단한다.
replicaCount: 1

application:
  enabled: false

deployment:
  enabled: false

image:
  repository: ghcr.io/team-pinlog/ai
  tag: d317f563c93a7980fa9e97f4c8421fddd5923d26
  digest: sha256:90fc0b64985a2cd55750992bf3df8065c798bdffaf8d3c36584b6235f9fc69cd
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-ai-pull

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 180

probes:
  enabled: true
  path: /health
  startup:
    path: /health
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /health
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /ready
    periodSeconds: 10
    failureThreshold: 3

# prod 전 metrics endpoint를 추가한다.
metrics:
  enabled: false

env: []
envFrom:
  - secretRef:
      name: ai-owner-secrets
  - secretRef:
      name: ai-db-credentials

# 승인된 preset artifact 계약만 기록하며 activation 승인 전에는 실행하지 않는다.
bootstrap:
  enabled: false
  version: "preset-204824bd37e6"
  command: ["python", "-m", "app.bootstrap.load_presets"]
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
