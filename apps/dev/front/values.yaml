# Frontend dev workload. 승인된 immutable image를 내부 ClusterIP로만 제공한다.
replicaCount: 1

application:
  enabled: true

deployment:
  enabled: true

image:
  repository: ghcr.io/team-pinlog/front
  tag: 890a809c697be7a60233d3c4d1d9314d9adc0c45-cfg-c9584acda2332f0109fb-run-31139045306-a1
  digest: sha256:53a77726992e42d6d28a2edf2d87fe55a4fe63799e2a9aaa008c8f931f595472
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-front-pull

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: i15a705.p.ssafy.io
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

writableTmp:
  enabled: true
  sizeLimit: 32Mi

autoscaling:
  enabled: false

probes:
  enabled: true
  path: /healthz

metrics:
  enabled: false

env: []
envFrom: []

bootstrap:
  enabled: false
  version: ""
  command: []
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
