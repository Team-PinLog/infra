# Frontend dev workload. 승인된 immutable image를 내부 ClusterIP로만 제공한다.
replicaCount: 1

application:
  enabled: true

deployment:
  enabled: true

image:
  repository: ghcr.io/team-pinlog/front
  tag: 41eb6e7458ea80637c7546a9c567608a4a5eb3d5-cfg-c9584acda2332f0109fb-run-31133859956-a1
  digest: sha256:d1b59856e5766a5f697336552ec3ab1da8b157910cea7e5d62971832f2be9e88
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-front-pull

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: i15a705.p.ssafy.io
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

writableTmp:
  enabled: true
  sizeLimit: 32Mi

autoscaling:
  enabled: false

probes:
  enabled: true
  path: /healthz

metrics:
  enabled: false

env: []
envFrom: []

bootstrap:
  enabled: false
  version: ""
  command: []
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
