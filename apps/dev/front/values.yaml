# Frontend dev workload. 승인된 immutable image를 내부 ClusterIP로만 제공한다.
replicaCount: 1

application:
  enabled: true

deployment:
  enabled: true

image:
  repository: ghcr.io/team-pinlog/front
  tag: 296e358b857f12464e0091a3917b7f4d5f44e1b6
  digest: sha256:8608c342620dc2442ec3049c0def60975f953a41a963b218d5bb1dec423b46c4
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-front-pull

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: i15a705.p.ssafy.io
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

writableTmp:
  enabled: true
  sizeLimit: 32Mi

autoscaling:
  enabled: false

probes:
  enabled: true
  path: /healthz

metrics:
  enabled: false

env: []
envFrom: []

bootstrap:
  enabled: false
  version: ""
  command: []
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
