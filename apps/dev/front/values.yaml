# Frontend dev workload. 승인된 immutable image를 내부 ClusterIP로만 제공한다.
replicaCount: 1

application:
  enabled: true

deployment:
  enabled: true

image:
  repository: ghcr.io/team-pinlog/front
  tag: 4df0df9ec2be5c1ad644a6f5e29acecf1d2fa31f-cfg-b41c064fb34a495a273b-run-30699100709-a1
  digest: sha256:5d2f2eba2eb6721970967373d0c1e9c1dd28ec186a9e2c50777f41e60fe43d8a
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-front-pull

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: i15a705.p.ssafy.io
  path: /
  pathType: Prefix

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

writableTmp:
  enabled: true
  sizeLimit: 32Mi

autoscaling:
  enabled: false

probes:
  enabled: true
  path: /healthz

metrics:
  enabled: false

env: []
envFrom: []

bootstrap:
  enabled: false
  version: ""
  command: []
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
