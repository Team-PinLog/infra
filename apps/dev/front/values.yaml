# Frontend dev scaffold. 이미지 승격 자동화만 먼저 연결하고 workload는 승인 전까지 차단한다.
replicaCount: 1

application:
  enabled: false

deployment:
  enabled: false

image:
  repository: ghcr.io/team-pinlog/front
  tag: fb25d1e804f9ecfd5af380f9d31afbe4a269b6b0
  digest: sha256:83148284c11c6a2e6980d585196ccc4bfa2db0323d97d3cb456e5212fe9a8d24
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-front-pull

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

writableTmp:
  enabled: true
  sizeLimit: 32Mi

autoscaling:
  enabled: false

probes:
  enabled: true
  path: /healthz

metrics:
  enabled: false

env: []
envFrom: []

bootstrap:
  enabled: false
  version: ""
  command: []
  backoffLimit: 1

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
