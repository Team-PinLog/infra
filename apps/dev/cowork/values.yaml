replicaCount: 1

image:
  repository: ghcr.io/team-pinlog/cowork
  tag: 39bb128c5e39a599715fc8746670fe3f2d472697
  digest: sha256:f10d4b3d1936d3ef9793e010321924adefa742293345439cdf4c6104b10542ce
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-cowork-pull

# SQLite를 하나의 PVC에 보존하므로 두 Pod를 동시에 띄우지 않는다.
deploymentStrategy:
  type: Recreate

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false

probes:
  enabled: true
  path: /health
  startup:
    failureThreshold: 30
    periodSeconds: 2
  liveness:
    periodSeconds: 15
    failureThreshold: 3
  readiness:
    periodSeconds: 5
    failureThreshold: 3

metrics:
  enabled: false

env:
  - name: COWORK_ENV
    value: development
  - name: COWORK_COOKIE_SECURE
    value: "true"
  - name: COWORK_DATABASE_PATH
    value: /data/cowork/cowork.db
  - name: COWORK_AGENT_TIMEOUT_SECONDS
    value: "120"
  - name: JIRA_PROJECT_KEY
    value: S15P11A705
  - name: JIRA_BASE_URL
    value: https://ssafy.atlassian.net
  - name: JIRA_BOARD_ID
    value: "13941"
  - name: GMS_KEY
    valueFrom:
      secretKeyRef:
        name: cowork-api-credentials
        key: GMS_KEY
  - name: JIRA_EMAIL
    valueFrom:
      secretKeyRef:
        name: cowork-api-credentials
        key: JIRA_EMAIL
  - name: JIRA_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cowork-api-credentials
        key: JIRA_API_TOKEN

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

persistence:
  enabled: true
  mountPath: /data
  size: 1Gi
  storageClass: local-path-retain
  accessModes:
    - ReadWriteOnce

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

serviceAccount:
  create: true
  name: ""
