replicaCount: 1

image:
  repository: ghcr.io/team-pinlog/back
  tag: 5bbd1f464b24bea86deacb8e677451cb3f0e507f
  digest: sha256:0d74bb98792f681617e79b04d594af477da426f4f9a1829d0030d7c275527a78
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-back-pull

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 40
lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 5"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: traefik
  host: i15a705.p.ssafy.io
  path: /api/core
  pathType: Prefix

probes:
  enabled: true
  startup:
    path: /api/core/actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /api/core/actuator/health/liveness
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /api/core/actuator/health/readiness
    periodSeconds: 10
    failureThreshold: 3

metrics:
  enabled: true
  path: /api/core/actuator/prometheus
  interval: 60s
  scrapeTimeout: 10s

envFrom:
  - secretRef:
      name: back-owner-secrets

env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
  - name: SPRING_DATASOURCE_URL
    value: jdbc:postgresql://postgres:5432/pinlog
  - name: SPRING_DATASOURCE_USERNAME
    value: pinlog
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: password
  - name: SPRING_DATA_REDIS_HOST
    value: redis
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"
  - name: PINLOG_AI_BASE_URL
    value: http://ai.pinlog-dev.svc.cluster.local:8000
  - name: PINLOG_SEARCH_GATE_ENABLED
    value: "true"
  - name: PINLOG_SEARCH_GATE_SIMILARITY_THRESHOLD
    value: "0.35"
  - name: PINLOG_SEARCH_RELEVANCE_JUDGE_ENABLED
    value: "true"

resources:
  requests:
    memory: 384Mi
    cpu: 100m
  limits:
    memory: 768Mi
    cpu: 500m

autoscaling:
  enabled: false

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""

podAnnotations:
  secrets.pinlog.io/revision: bad3c098e321e1b0c3ec372629509ed609468df4
