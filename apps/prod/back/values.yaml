replicaCount: 1

image:
  repository: ghcr.io/team-pinlog/back
  tag: 9e3bd3c5b6bae9d4f22bb9afed737a0345595269
  digest: sha256:e952d15cb26c78f141d5c2e5e45d9a1de815e689d6aed4c2e694dcfc55c2e234
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-back-pull

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

terminationGracePeriodSeconds: 40
lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 5"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false

probes:
  enabled: true
  startup:
    path: /api/core/actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /api/core/actuator/health/liveness
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    path: /api/core/actuator/health/readiness
    periodSeconds: 10
    failureThreshold: 3

metrics:
  enabled: true
  path: /api/core/actuator/prometheus
  interval: 60s
  scrapeTimeout: 10s

env:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"
  - name: SPRING_DATASOURCE_URL
    value: jdbc:postgresql://postgres:5432/pinlog
  - name: SPRING_DATASOURCE_USERNAME
    value: pinlog
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-credentials
        key: password
  - name: SPRING_DATA_REDIS_HOST
    value: redis
  - name: SPRING_DATA_REDIS_PORT
    value: "6379"

resources:
  requests:
    memory: 384Mi
    cpu: 100m
  limits:
    memory: 768Mi
    cpu: 500m

autoscaling:
  enabled: false

persistence:
  enabled: false

serviceAccount:
  create: true
  name: ""
